<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F1E9">
<title>Arme P&amp;B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1E9; --surface: #FFFDF9; --surface2: #EFE8DC; --ink: #23201B; --muted: #6E665A; --line: #E3DACB;
  --accent: #C2562B; --accent-ink: #fff; --ok: #3B7A57; --bad: #A33A1C;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --display: 'Fraunces', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171512; --surface: #211E1A; --surface2: #2B2722; --ink: #F2ECE2; --muted: #A79E90; --line: #37322B;
  --accent: #E07A4F; --accent-ink: #1C0D03; --ok: #6DBB8C; --bad: #F08B6A; color-scheme: dark; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }
body { display: grid; grid-template-rows: 1fr auto; height: 100vh; height: 100dvh; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 2px 4px env(safe-area-inset-bottom); }
.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 9px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabs svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }
main { position: relative; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.ov { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: grid; place-items: center; padding: 20px; overflow: auto; }
.card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; box-shadow: 0 6px 24px rgba(60,45,20,.08); }
.card h1 { font-family: var(--display); font-size: 28px; margin: 0 0 4px; }
.card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.card label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.card input[type=email], .card input[type=password] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); }
.btn { width: 100%; border: 0; border-radius: 14px; padding: 13px; font-weight: 700; background: var(--accent); color: var(--accent-ink); margin-top: 14px; }
.btn.sec { background: var(--surface2); color: var(--ink); margin-top: 8px; }
.lnk { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 10px 0 0; width: 100%; }
.msg { font-size: 13px; margin: 10px 0 0 !important; min-height: 1em; } .msg.err { color: var(--bad) !important; } .msg.ok { color: var(--ok) !important; }
.sheet { position: fixed; inset: 0; z-index: 8; background: rgba(20,15,10,.45); display: grid; align-items: end; justify-items: center; }
.sheet .card { border-radius: 24px 24px 0 0; max-width: 460px; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .kv span { color: var(--muted); }

:root.pesca { --bg: #FBEFF2; --surface: #FFFAFB; --surface2: #F5E2E8; --ink: #2B1F23; --muted: #7C6369; --line: #EDD4DB; --accent: #C04A72; }
@media (prefers-color-scheme: dark) { :root.pesca:not([data-theme="light"]) { --bg: #1B1316; --surface: #251B1F; --surface2: #302328; --ink: #F5E9ED; --muted: #B39CA4; --line: #3D2C33; --accent: #E688A8; } }
</style>
</head>
<body>
<main>
  <iframe id="f-diet" title="Dieta" hidden></iframe>
  <iframe id="f-gym" title="Palestra" hidden></iframe>
</main>
<nav class="tabs" aria-label="Sezioni">
  <button type="button" data-r="oggi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Oggi</button>
  <button type="button" data-r="allena"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Allenamento</button>
  <button type="button" data-r="piano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Piano</button>
  <button type="button" data-r="spesa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>Spesa</button>
  <button type="button" data-r="progressi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progressi</button>
</nav>

<div class="ov" id="login" hidden>
  <form class="card" id="lform" novalidate>
    <h1>Arme P&amp;B</h1>
    <p>Dieta e palestra in un’unica app. Accedi per ritrovare i tuoi dati su ogni dispositivo.</p>
    <button class="btn" type="button" id="lgoogle" style="margin-top:0">Continua con Google</button>
    <p class="msg" style="text-align:center;margin:12px 0 0 !important">oppure con email e password</p>
    <label for="lemail">Email</label><input id="lemail" type="email" autocomplete="username" inputmode="email">
    <label for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password">
    <p class="msg" id="lmsg" role="status"></p>
    <button class="btn sec" type="submit" id="lin">Accedi con email</button>
    <button class="btn sec" type="button" id="lup">Crea account (solo la prima volta)</button>
    <button class="lnk" type="button" id="lforgot">Password dimenticata</button>
    <button class="lnk" type="button" id="loff">Usa solo su questo dispositivo</button>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="stt">
    <h1 id="stt" style="font-size:22px">Account</h1>
    <div class="kv"><span>Accesso</span><b id="sEmail">—</b></div>
    <div class="kv"><span>Stato</span><b id="sState">—</b></div>
    <button class="btn" type="button" id="sNow">Sincronizza adesso</button>
    <button class="btn sec" type="button" id="sExp">Scarica backup dei dati</button>
    <button class="btn sec" type="button" id="sImp">Importa backup</button>
    <input type="file" id="sFile" accept="application/json,.json" hidden>
    <button class="btn sec" type="button" id="sOut">Esci</button>
    <button class="lnk" type="button" id="sClose">Chiudi</button>
    <p class="msg" id="smsg" role="status"></p>
  </div>
</div>

<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.ARME_CFG || {};
  var KEYS = { diet: 'dieta-pb-v3', gym: 'spinta-trazione-braccia-v1' };
  var META_K = 'arme-sync-meta-v2', VIEW_K = 'arme-view', OFF_K = 'arme-offline';
  var FB = 'https://www.gstatic.com/firebasejs/10.12.2/firebase-';
  var $ = function (s) { return document.querySelector(s); };
  function ls(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var meta = {}; try { meta = JSON.parse(ls(META_K) || '{}') || {}; } catch (e) { meta = {}; }
  function saveMeta() { lsSet(META_K, JSON.stringify(meta)); }
  function hash(s) { var h = 5381, i = s.length; while (i) h = (h * 33) ^ s.charCodeAt(--i); return (h >>> 0).toString(36) + ':' + s.length; }
  function parse(s) { try { return JSON.parse(s); } catch (e) { return null; } }
  function isObj(x) { return x && typeof x === 'object' && !Array.isArray(x); }
  /* unione: gli oggetti si fondono chiave per chiave, in caso di conflitto vince b (questo dispositivo) */
  function merge(a, b) {
    if (!isObj(a) || !isObj(b)) return b === undefined ? a : b;
    var o = {}, k; for (k in a) o[k] = a[k];
    for (k in b) o[k] = (k in a) ? merge(a[k], b[k]) : b[k];
    return o;
  }

  var be = null, fbAuth = null, user = null, started = false, applied = {}, pushTimer = 0, busy = false, lastOk = 0, view = 'diet', first = true;

  /* ---------- stato visivo ---------- */
  var ARME = window.ARME = { acct: { k: '', l: '' } };
  function status(kind, txt) {
    ARME.acct = { k: kind || '', l: user ? String(user.displayName || user.email || '?').trim().charAt(0).toUpperCase() : '' };
    try { $('#f-diet').contentWindow.ARME_DIET.paint(); } catch (e) {}
    $('#sState').textContent = { ok: 'sincronizzato', sync: 'sincronizzo…', bad: 'offline: i dati restano sul dispositivo' }[kind] || (user ? '—' : 'solo su questo dispositivo');
  }
  function say(el, t, c) { el.textContent = t || ''; el.className = 'msg' + (c ? ' ' + c : ''); }

  /* ---------- navigazione: Oggi · Allenamento · Piano · Spesa · Progressi ---------- */
  var ROUTES = ['oggi', 'allena', 'piano', 'spesa', 'progressi'], DTAB = { oggi: 'oggi', piano: 'settimana', spesa: 'spesa', progressi: 'analisi' };
  var NAVOF = { oggi: 'oggi', settimana: 'piano', spesa: 'spesa', analisi: 'progressi' }, route = 'oggi', pendingTab = null;
  function normRoute(r) { r = { diet: 'oggi', gym: 'allena' }[r] || r; return ROUTES.indexOf(r) >= 0 ? r : 'oggi'; }
  function markNav(r) { document.querySelectorAll('.tabs button').forEach(function (b) { if (b.dataset.r === r) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); }
  function dietSrc() { return 'diet/index.html?embed=1&tab=' + (DTAB[route] || 'oggi'); }
  function goDiet(t) { try { var w = $('#f-diet').contentWindow; if (w && w.ARME_DIET) { w.ARME_DIET.go(t); return; } } catch (e) {} pendingTab = t; }
  function show(r) {
    r = normRoute(r); route = r; view = r === 'allena' ? 'gym' : 'diet'; lsSet(VIEW_K, r); markNav(r);
    if (!started) return;
    if (view === 'gym' && !$('#f-gym').getAttribute('src')) $('#f-gym').src = 'gym/index.html';
    $('#f-diet').hidden = view !== 'diet'; $('#f-gym').hidden = view !== 'gym';
    if (view === 'diet') goDiet(DTAB[r]);
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { if (location.hash !== '#' + b.dataset.r) location.hash = b.dataset.r; else show(b.dataset.r); }); });
  window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
  /* la dieta avvisa quando cambia sezione da sola (es. tocca un giorno della settimana) */
  ARME.tab = function (dt) { var r = NAVOF[dt] || 'oggi'; if (view === 'diet' && r !== route) { route = r; lsSet(VIEW_K, r); markNav(r); try { history.replaceState(null, '', '#' + r); } catch (e) {} } };
  ARME.openAccount = function () { openAccount(); };
  $('#f-diet').addEventListener('load', function () { if (pendingTab) { var t = pendingTab; pendingTab = null; goDiet(t); } });

  function startApps() {
    if (started) return; started = true;
    route = normRoute(location.hash.slice(1) || ls(VIEW_K) || 'oggi');
    $('#f-diet').src = dietSrc();
    show(route);
  }
  function reloadApp(k) {
    var f = $('#f-' + k); if (!started || !f.getAttribute('src')) return;
    if (k === 'diet') { f.src = dietSrc(); return; }
    try { f.contentWindow.location.reload(); } catch (e) { f.src = f.src; }
  }
  function typing() { try { var d = $('#f-' + view).contentDocument; var a = d && d.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && a.value; } catch (e) { return false; } }

  /* ---------- database (Firebase / Firestore): users/{uid}/state/{diet|gym} ---------- */
  function initBackend() {
    var app = firebase.initializeApp(CFG.firebase); fbAuth = firebase.auth(); var db = firebase.firestore();
    var col = function () { return db.collection('users').doc(fbAuth.currentUser.uid).collection('state'); };
    be = {
      getAll: function () {
        /* un documento alla volta: le regole non permettono di leggere l'intera raccolta in una sola richiesta */
        return Promise.all(Object.keys(KEYS).map(function (k) { return col().doc(k).get({ source: 'server' }); })).then(function (docs) {
          var m = {}; docs.forEach(function (d) { if (!d.exists) return; var x = d.data(); m[d.id] = { value: parse(x.value), ts: String(x.updatedAt && x.updatedAt.toMillis ? x.updatedAt.toMillis() : 0) }; }); return m;
        });
      },
      put: function (k, v) {
        var ref = col().doc(k);
        return ref.set({ value: JSON.stringify(v), updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
          .then(function () { return ref.get({ source: 'server' }); }).then(function (d) { return String(d.data().updatedAt.toMillis()); });
      }
    };
  }

  /* ---------- sincronizzazione ---------- */
  function raw(k) { return ls(KEYS[k]); }
  function writeLocal(k, val, ts) { var s = JSON.stringify(val); lsSet(KEYS[k], s); meta[k] = { h: hash(s), ts: ts }; saveMeta(); }
  function push(k, valOverride) {
    var s = raw(k); if (s === null) return Promise.resolve();
    var v = valOverride !== undefined ? valOverride : parse(s); if (v === null) return Promise.resolve();
    var sent = valOverride !== undefined ? JSON.stringify(valOverride) : s;
    return be.put(k, v).then(function (ts) { meta[k] = { h: hash(sent), ts: ts }; saveMeta(); });
  }
  function reconcile() {
    return be.getAll().then(function (remote) {
      var jobs = [], changed = [];
      Object.keys(KEYS).forEach(function (k) {
        var rm = remote[k], loc = raw(k), m = meta[k] || {}, locChanged = loc !== null && hash(loc) !== m.h, remNew = rm && rm.ts !== m.ts;
        if (!rm) { if (loc !== null) jobs.push(push(k)); return; }
        if (loc === null) { writeLocal(k, rm.value, rm.ts); changed.push(k); return; }
        if (!locChanged && remNew) { writeLocal(k, rm.value, rm.ts); changed.push(k); return; }
        if (locChanged && !remNew) { jobs.push(push(k)); return; }
        if (locChanged && remNew) {
          var merged = merge(rm.value, parse(loc)); lsSet(KEYS[k], JSON.stringify(merged)); changed.push(k);
          jobs.push(push(k, merged));
        }
      });
      return Promise.all(jobs).then(function () { return changed; });
    });
  }
  function syncNow(isInitial) {
    if (!be || !user || busy) return Promise.resolve([]);
    if (!navigator.onLine) { status('bad', 'Offline'); return Promise.resolve([]); }
    busy = true; status('sync', 'Sincronizzo');
    return reconcile().then(function (changed) {
      lastOk = Date.now(); status('ok', 'Sincronizzato');
      if (!isInitial) changed.forEach(function (k) { if (typing() && k === view) { applied[k] = true; } else reloadApp(k); });
      return changed;
    }, function (e) { status('bad', 'Offline'); say($('#smsg'), 'Sincronizzazione non riuscita: ' + nice(e), 'err'); return []; })
      .then(function (c) { busy = false; return c; });
  }
  function scheduleCheck() {
    if (!user) return;
    Object.keys(applied).forEach(function (k) { if (!(k === view && typing())) { delete applied[k]; reloadApp(k); } });
    var dirty = Object.keys(KEYS).some(function (k) { var s = raw(k); return s !== null && hash(s) !== (meta[k] || {}).h; });
    if (dirty && !pushTimer && !busy) pushTimer = setTimeout(function () { pushTimer = 0; syncNow(false); }, 1200);
  }
  setInterval(scheduleCheck, 2500);
  setInterval(function () { if (user && !document.hidden && Date.now() - lastOk > 45000) syncNow(false); }, 15000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && user) syncNow(false); });
  window.addEventListener('online', function () { syncNow(false); });
  window.addEventListener('offline', function () { status('bad', 'Offline'); });

  /* ---------- accesso ---------- */
  function setUser(u) { user = u; $('#sEmail').textContent = u ? u.email : '—'; status(u ? 'sync' : '', u ? 'Account' : 'Solo qui'); }
  function gotUser(u) {
    if (user && user.uid === u.uid) return;
    setUser(u); $('#login').hidden = true; try { localStorage.removeItem(OFF_K); } catch (e) {}
    syncNow(true).then(function () { startApps(); });
  }
  function loadScripts(list) {
    return list.reduce(function (p, src) {
      return p.then(function () { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('sdk')); }; document.head.appendChild(s); }); });
    }, Promise.resolve());
  }
  function offlineStart() { setUser(null); $('#login').hidden = true; status('', 'Solo qui'); startApps(); }
  function boot() {
    if (!CFG.firebase || !CFG.firebase.apiKey) {
      if (ls(OFF_K) === '1') return offlineStart();
      $('#login').hidden = false; say($('#lmsg'), 'Il collegamento al database non è ancora configurato: puoi usare l’app solo su questo dispositivo.', 'err'); return;
    }
    (window.firebase ? Promise.resolve() : loadScripts([FB + 'app-compat.js', FB + 'auth-compat.js', FB + 'firestore-compat.js'])).then(function () {
      initBackend();
      fbAuth.onAuthStateChanged(function (u) {
        if (u) { first = false; gotUser(u); return; }
        user = null; $('#sEmail').textContent = '—';
        if (first) { first = false; if (ls(OFF_K) === '1') offlineStart(); else $('#login').hidden = false; }
      });
    }, function () { offlineStart(); status('bad', 'Offline'); });
  }
  function creds() { return { email: $('#lemail').value.trim(), password: $('#lpass').value }; }
  function nice(e) {
    var c = e && e.code || '', m = String(e && e.message || e);
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Email o password non corretti.';
    if (/email-already-in-use/.test(c)) return 'Questa email è già registrata: usa “Accedi”.';
    if (/weak-password/.test(c)) return 'Password troppo corta: almeno 8 caratteri.';
    if (/invalid-email/.test(c)) return 'Email non valida.';
    if (/popup-closed|cancelled-popup/.test(c)) return 'Accesso annullato.';
    if (/unauthorized-domain/.test(c)) return 'Dominio non autorizzato: aggiungi palestraarme.netlify.app in Authentication → Impostazioni → Domini autorizzati.';
    if (/network/.test(c)) return 'Nessuna connessione.';
    if (/too-many/.test(c)) return 'Troppi tentativi: riprova tra qualche minuto.';
    if (/permission-denied/.test(c)) return 'Permessi del database non configurati (regole Firestore).';
    if (/operation-not-allowed/.test(c)) return 'Accesso con email non attivo nel progetto Firebase.';
    return m;
  }
  $('#lform').addEventListener('submit', function (e) {
    e.preventDefault(); var c = creds(); if (!fbAuth) return;
    if (!c.email || !c.password) return say($('#lmsg'), 'Inserisci email e password.', 'err');
    say($('#lmsg'), 'Accesso…'); fbAuth.signInWithEmailAndPassword(c.email, c.password).then(function () { say($('#lmsg'), ''); }, function (er) { say($('#lmsg'), nice(er), 'err'); });
  });
  $('#lup').addEventListener('click', function () {
    var c = creds(); if (!fbAuth) return;
    if (!c.email || c.password.length < 8) return say($('#lmsg'), 'Email e password di almeno 8 caratteri.', 'err');
    say($('#lmsg'), 'Creo l’account…'); fbAuth.createUserWithEmailAndPassword(c.email, c.password).then(function () { say($('#lmsg'), ''); }, function (er) { say($('#lmsg'), nice(er), 'err'); });
  });
  $('#lforgot').addEventListener('click', function () {
    var em = $('#lemail').value.trim(); if (!fbAuth || !em) return say($('#lmsg'), 'Scrivi la tua email e riprova.', 'err');
    fbAuth.sendPasswordResetEmail(em).then(function () { say($('#lmsg'), 'Ti ho mandato un’email per scegliere una nuova password.', 'ok'); }, function (er) { say($('#lmsg'), nice(er), 'err'); });
  });
  $('#lgoogle').addEventListener('click', function () {
    if (!fbAuth) return say($('#lmsg'), 'Collegamento al database non configurato.', 'err');
    var pr = new firebase.auth.GoogleAuthProvider(); say($('#lmsg'), 'Apro Google…');
    fbAuth.signInWithPopup(pr).then(function () { say($('#lmsg'), ''); }, function (er) {
      if (er && /popup-blocked|operation-not-supported/.test(er.code || '')) return fbAuth.signInWithRedirect(pr);
      say($('#lmsg'), nice(er), 'err');
    });
  });
  $('#loff').addEventListener('click', function () { lsSet(OFF_K, '1'); offlineStart(); });

  /* ---------- foglio account ---------- */
  function openAccount() {
    if (!user) { if (fbAuth || (CFG.firebase && CFG.firebase.apiKey)) { try { localStorage.removeItem(OFF_K); } catch (e) {} $('#login').hidden = false; return; } }
    say($('#smsg'), ''); $('#sheet').hidden = false;
  }
  $('#sClose').addEventListener('click', function () { $('#sheet').hidden = true; });
  $('#sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') $('#sheet').hidden = true; });
  $('#sNow').addEventListener('click', function () { say($('#smsg'), ''); syncNow(false).then(function () { if (!$('#smsg').textContent) say($('#smsg'), 'Fatto.', 'ok'); }); });
  $('#sOut').addEventListener('click', function () {
    if (!fbAuth) return;
    syncNow(false).then(function () { return fbAuth.signOut(); }).then(function () {
      Object.keys(KEYS).forEach(function (k) { try { localStorage.removeItem(KEYS[k]); } catch (e) {} }); meta = {}; saveMeta(); location.hash = ''; location.reload();
    });
  });
  $('#sExp').addEventListener('click', function () {
    var o = { app: 'arme-pb', exported: new Date().toISOString() }; Object.keys(KEYS).forEach(function (k) { o[k] = parse(raw(k)); });
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 1)], { type: 'application/json' })); a.download = 'arme-pb-backup.json'; a.click();
  });
  $('#sImp').addEventListener('click', function () { $('#sFile').click(); });
  $('#sFile').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = ''; if (!f) return;
    f.text().then(function (t) {
      var o = parse(t); if (!o || o.app !== 'arme-pb') return say($('#smsg'), 'File non valido.', 'err');
      Object.keys(KEYS).forEach(function (k) { if (o[k]) lsSet(KEYS[k], JSON.stringify(merge(parse(raw(k)) || {}, o[k]))); });
      say($('#smsg'), 'Importato.', 'ok'); syncNow(false).then(function () { Object.keys(KEYS).forEach(reloadApp); });
    });
  });
  window.__arme = { syncNow: syncNow };
  boot();
})();
</script>
</body>
</html>
