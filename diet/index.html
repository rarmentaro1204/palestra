<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F1E9">
<title>Piano Alimentare</title>
<script>if (/[?&]embed=1/.test(location.search)) document.documentElement.classList.add('embed');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F6F1E9; --surface: #FFFDF9; --surface2: #EFE8DC; --ink: #23201B; --muted: #6E665A; --line: #E3DACB;
  --accent: #C2562B; --accent-ink: #fff; --ok: #3B7A57; --ok-soft: #E2EFE6; --bad: #B4381A;
  --p: #C2562B; --c: #D9A23A; --f: #5C7FA3;
  --col: #B07D3A; --pra: #3B6E52; --mer: #7B9B6A; --cen: #4A6E8C;
  --shadow: 0 1px 2px rgba(60,45,20,.06), 0 6px 20px rgba(60,45,20,.06);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --display: 'Fraunces', Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171512; --surface: #211E1A; --surface2: #2B2722; --ink: #F2ECE2; --muted: #A79E90; --line: #37322B;
  --accent: #E07A4F; --ok: #6DBB8C; --ok-soft: #22332A; --p: #E07A4F; --c: #E0B65A; --f: #85A7CC; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #171512; --surface: #211E1A; --surface2: #2B2722; --ink: #F2ECE2; --muted: #A79E90; --line: #37322B;
  --accent: #E07A4F; --ok: #6DBB8C; --ok-soft: #22332A; --p: #E07A4F; --c: #E0B65A; --f: #85A7CC; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
h1, h2, h3 { margin: 0; }

/* header */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; }
.top.sc { border-bottom-color: var(--line); }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 8px; }
.brand small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.brand h1 { font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.who { display: flex; background: var(--surface2); border-radius: 999px; padding: 3px; }
.who button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.who button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 4px 0 12px; }
.dchip { border: 0; background: transparent; border-radius: 14px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 58px; }
.dchip .dn { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
.dchip .dd { font-family: var(--display); font-size: 20px; font-weight: 700; }
.dchip .di { font-size: 10px; height: 12px; line-height: 12px; }
.dchip.today .dd { color: var(--accent); }
.dchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dchip[aria-pressed="true"] .dn { color: inherit; opacity: .7; }
.dchip[aria-pressed="true"].today .dd { color: inherit; }

/* hero */
.hero { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; margin-top: 4px; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rv { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .rv b { font-family: var(--display); font-size: 26px; line-height: 1; }
.ring .rv span { font-size: 11px; color: var(--muted); margin-top: 3px; }
.macros { display: flex; flex-direction: column; gap: 9px; }
.mac { display: grid; grid-template-columns: 74px 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.mac .ml { font-weight: 600; }
.bar { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
.mac .mv { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 2px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--surface2); color: var(--ink); text-decoration: none; border: 0; }
.tag.walk { background: #E7EFE3; color: #2F5A3A; }
.tag.gym { background: #F6E1D6; color: #8A3412; }
.tag.free { background: #ECE5F3; color: #55407A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.walk { background: #22332A; color: #A9D8B6; } :root:not([data-theme="light"]) .tag.gym { background: #3A261C; color: #F2B597; } :root:not([data-theme="light"]) .tag.free { background: #2C253A; color: #CDB8EE; } }

/* meals */
.sect { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
.sect h2 { font-family: var(--display); font-size: 20px; }
.sect span { font-size: 13px; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.meal::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--mc, var(--accent)); }
.meal.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.mh { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 14px 14px 14px 18px; width: 100%; border: 0; background: transparent; text-align: left; }
.mh .mt { font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); text-transform: uppercase; letter-spacing: .03em; }
.mh h3 { font-size: 17px; font-weight: 700; margin-top: 2px; }
.mh .mk { font-size: 13px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.eat { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; transition: all .2s; }
.eat svg { width: 22px; height: 22px; opacity: .25; }
.eat[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.eat[aria-pressed="true"] svg { opacity: 1; }
.meal.done .mh h3 { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }
.mb { padding: 0 14px 14px 18px; display: none; }
.meal.open .mb { display: block; }
.ing { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); font-size: 15px; }
.ing li span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ing li.extra { color: var(--ok); }
.ing li.extra span:first-child::after { content: ' · camminata'; font-size: 12px; opacity: .8; }
.ing li.plus { color: var(--accent); }
.ing .sc { color: var(--accent); }
.ing li.plus span:first-child::after { content: ' · revisione'; font-size: 12px; opacity: .8; }
.hint { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
.ing li small { display: block; color: var(--muted); font-size: 12px; }
.mfoot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface2); padding: 8px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn.hi { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mmac { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; font-variant-numeric: tabular-nums; }
.mmac b { color: var(--ink); font-weight: 600; }

/* supplements */
.supp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sp { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; display: grid; grid-template-columns: 1fr 24px; gap: 4px; align-items: center; }
.sp b { font-size: 14px; } .sp small { grid-column: 1; color: var(--muted); font-size: 12px; }
.sp .ck { grid-row: 1 / span 2; grid-column: 2; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.sp[aria-pressed="true"] { background: var(--ok-soft); border-color: transparent; }
.sp[aria-pressed="true"] .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.sp .ck svg { width: 14px; height: 14px; opacity: 0; } .sp[aria-pressed="true"] .ck svg { opacity: 1; }
.rules { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 14px; box-shadow: var(--shadow); }
.rules summary { cursor: pointer; font-weight: 700; padding: 12px 0; }
.rules ul { margin: 0 0 12px; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.note { font-size: 13px; color: var(--muted); background: var(--surface2); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
.note b { color: var(--ink); }

/* week view */
.wk { display: flex; flex-direction: column; gap: 10px; }
.wd { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; text-align: left; width: 100%; box-shadow: var(--shadow); }
.wd.today { border-color: var(--accent); }
.wd .wh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.wd h3 { font-family: var(--display); font-size: 19px; }
.wd .wk2 { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wd .wm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.wd .wm span { font-size: 12px; background: var(--surface2); border-radius: 10px; padding: 7px 8px; line-height: 1.25; }
.wd .wm span b { display: block; font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; margin-bottom: 2px; }
.wd .tags { margin: 8px 0 0; }

/* shop */
.prog { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.prog .bar { flex: 1; height: 10px; }
.prog b { font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.cat { margin-top: 18px; }
.cat h3 { font-size: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; }
.cat h3 small { color: var(--muted); font-weight: 600; }
.it { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; margin-bottom: 6px; }
.it .ck { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; }
.it .ck svg { width: 16px; height: 16px; opacity: 0; }
.it .q { font-size: 13px; color: var(--muted); text-align: right; max-width: 45vw; }
.it[aria-pressed="true"] { opacity: .55; }
.it[aria-pressed="true"] .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.it[aria-pressed="true"] .ck svg { opacity: 1; }
.it[aria-pressed="true"] .nm { text-decoration: line-through; }

/* recipes */
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font: inherit; color: var(--ink); }
.filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.filters::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.rc { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); min-height: 128px; }
.rc .re { font-size: 30px; line-height: 1; }
.rc b { font-size: 14px; line-height: 1.25; }
.rc small { color: var(--muted); font-size: 12px; margin-top: auto; }
.goal { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin-top: 8px; }
.goal .gh { display: flex; justify-content: space-between; gap: 12px; }
.goal small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.goal b { font-family: var(--display); font-size: 28px; display: block; line-height: 1.1; }
.goal .gh span { font-size: 13px; color: var(--muted); }
.gl { margin: 6px 0 0; font-size: 14px; color: var(--muted); } .gl b { color: var(--ink); font-family: var(--font); font-size: 14px; display: inline; }
.kvs { margin-top: 10px; border-top: 1px solid var(--line); }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv span { color: var(--muted); } .kv b { font-family: var(--font); font-size: 14px; display: inline; }
.warn { color: #9A3B12; }
.wh summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 12px 0 4px; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 0 4px; }
.wf { display: flex; gap: 8px; margin-top: 12px; } .wf input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--ink); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }


/* analisi */
.mg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.mf { display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; }
.mf span { color: var(--muted); font-weight: 600; line-height: 1.2; } .mf span em { font-style: normal; color: var(--accent); }
.mf input, .mdate { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; font: inherit; color: var(--ink); width: 100%; min-width: 0; }
.mhd { margin: 14px 0 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); grid-column: 1 / -1; }
.ind { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.ind div { background: var(--surface2); border-radius: 14px; padding: 10px 12px; } .ind small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; } .ind b { font-family: var(--display); font-size: 22px; line-height: 1.2; } .ind span { display: block; font-size: 12px; color: var(--muted); }
.dl { color: var(--ok); font-weight: 700; } .du { color: #9A3B12; font-weight: 700; }
.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; margin-top: 10px; box-shadow: var(--shadow); }
.guide summary { cursor: pointer; font-weight: 700; padding: 12px 0; font-size: 15px; }
.guide p, .guide li { font-size: 14px; color: var(--muted); margin: 0 0 8px; } .guide ol, .guide ul { padding-left: 20px; margin: 0 0 8px; } .guide b { color: var(--ink); }
.star { color: var(--accent); font-weight: 700; }

/* cal15 */
.cday { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; }
.cday.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cday.past { opacity: .6; }
.cday h3 { font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.cday h3 small { color: var(--muted); font-weight: 600; }
.crow { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.crow button { border: 0; background: var(--surface2); border-radius: 10px; padding: 8px 10px; text-align: left; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.crow button em { font-style: normal; font-size: 11px; color: var(--muted); text-transform: uppercase; font-weight: 700; width: 64px; flex: none; }

/* bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 4px; }
.nb { border: 0; background: transparent; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
.nb svg { width: 24px; height: 24px; }
.nb[aria-current="page"] { color: var(--accent); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(20,15,10,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); padding: 8px 0 calc(24px + env(safe-area-inset-bottom)); }
.sheet:not(.on) { visibility: hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s .28s; }
.sheet.on { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 10px; }
.sh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sh h2 { font-family: var(--display); font-size: 22px; line-height: 1.2; }
.x { border: 0; background: var(--surface2); width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.steps { margin: 6px 0 0; padding-left: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 8px 0; font-size: 15px; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.sheet h4 { margin: 16px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.rlist { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.rli { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 12px; text-align: left; width: 100%; }
.rli .re { font-size: 26px; }
.rli small { display: block; color: var(--muted); font-size: 12px; }
.rli.pick { border-color: var(--accent); }

/* ===== restyling 2026-11: più aria, meno blocchi ===== */
.embed .nav { display: none; }
.embed body { padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
.hrow { padding: 10px 0 6px; }
.brand h1 { font-size: 26px; }
.brand small:empty { display: none; }
.brand small { text-transform: none; letter-spacing: 0; font-size: 13px; white-space: nowrap; }
.hr { display: flex; align-items: center; gap: 8px; }
.who button { padding: 6px 10px; font-size: 13px; }
.me { display: none; position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; place-items: center; padding: 0; }
.embed .me { display: grid; }
.me i { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bg); background: var(--muted); }
.me i.ok { background: var(--ok); } .me i.bad { background: var(--bad); } .me i.sync { background: var(--accent); }
.dchip { min-height: 50px; padding: 5px 0; }
.dchip .dd { font-size: 18px; }
.dchip .di { width: 5px; height: 5px; border-radius: 50%; margin-top: 3px; background: transparent; font-size: 0; }
.dchip .di.g { background: var(--accent); }
.dchip[aria-pressed="true"] .di.g { background: var(--bg); }

      if (ds.lplan) { var mm = mealOf(LG.key, LG.i), fx = +ds.lplan; LG.items = LG.items.filter(function (e) { return !e.plan; }); LG.items.unshift({ n: 'Pasto del piano', q: fx === 1 ? 'tutto' : '×' + String(fx).replace('.', ','), k: Math.round(mm.kcal * fx), p: r1(mm.p * fx), c: r1(mm.c * fx), f: r1(mm.f * fx), plan: fx }); return lgRefresh(); }
      if (ds.lf) { LG.pick = LG.res[+ds.lf]; lgRefresh(true); var gi = $('#lgr'); if (gi) { gi.focus(); gi.select(); } return; }
      if (ds.lqty) { $('#lgr').value = String(ds.lqty).replace('.', ','); $('#lpk').innerHTML = pickKcal(); return; }
      if (ds.ladd !== undefined) { var q = parseFloat(String($('#lgr').value).replace(',', '.')); if (!(q > 0)) return $('#lgr').focus(); LG.items.push(entryOf(LG.pick, q)); addRecent(LG.pick[0]); LG.pick = null; LG.q = ''; return lgRefresh(true); }
      if (ds.lback !== undefined) { LG.pick = null; LG.man = false; return lgRefresh(true); }
      if (ds.lman !== undefined) { LG.man = true; lgRefresh(true); $('#lmn').focus(); return; }
      if (ds.lmadd !== undefined) {
        var nm = $('#lmn').value.trim(), kc = parseFloat(String($('#lmk').value).replace(',', '.')), pr = parseFloat(String($('#lmp').value).replace(',', '.')) || 0;
        if (!nm) return $('#lmn').focus(); if (isNaN(kc) || kc < 0) return $('#lmk').focus();
        LG.items.push({ n: nm, q: '1 porz.', k: Math.round(kc), p: r1(pr), c: 0, f: 0 });
        if ($('#lms').checked) { S.myfoods = [[nm, Math.round(kc), r1(pr), 0, 0, 1, '1 porzione', 'pz']].concat(S.myfoods.filter(function (f) { return f[0] !== nm; })).slice(0, 60); addRecent(nm); }
        LG.man = false; return lgRefresh(true);
      }
      if (ds.lrm) { LG.items.splice(+ds.lrm, 1); return lgRefresh(); }
      if (ds.lsave !== undefined) return saveLog();
    }
    if (ds.newmeas !== undefined) return openSheet(measFormHTML());
    if (ds.vid) { var v = ds.vid; t.outerHTML = '<div class="vidf"><iframe src="https://www.youtube-nocookie.com/embed/' + v + '?autoplay=1&rel=0&playsinline=1" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe><a href="https://www.youtube.com/watch?v=' + v + '" target="_blank" rel="noopener">Apri su YouTube ›</a></div>'; return; }
    if (ds.who) { S.who = ds.who; save(); rf = 'all'; return render(); }
    if (ds.tab) { tab = ds.tab; if (tab !== 'oggi') sel = TODAYI; window.scrollTo(0, 0); return render(); }
    if (ds.day) { sel = +ds.day; return render(); }
    if (ds.goday) { sel = +ds.goday; tab = 'oggi'; window.scrollTo(0, 0); return render(); }
    if (ds.toggle) { var k = sel + S.who; openKeys[k] = openKeys[k] || {}; openKeys[k][ds.toggle] = !openKeys[k][ds.toggle]; return renderOggi(); }
    if (ds.eat) {
      var dk = iso(dateOf(sel)); S.eaten[dk] = S.eaten[dk] || {}; S.eaten[dk][S.who] = S.eaten[dk][S.who] || {};
      var e = S.eaten[dk][S.who], lgd = (S.log[dk] || {})[S.who] || {};
      if ((lgd[ds.eat] || []).length) { if (!confirm('Togliere quello che hai registrato per questo pasto?')) return; delete lgd[ds.eat]; e[ds.eat] = true; }
      e[ds.eat] = !e[ds.eat]; markReal(sel);
      if (e[ds.eat]) { var ok2 = openKeys[sel + S.who] = {}; var ms = meals(S.who, sel), nk = nextKey(ms, e); if (nk) ok2[nk] = true; try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} }
      save(); return renderOggi();
    }
    if (ds.delw) { delete S.w[ds.delw]; if (S.eng && S.eng.upd === ds.delw) { S.eng.tdee = S.eng.prev || S.eng.tdee; delete S.eng.upd; } save(); PLAN = null; return renderAnalisi(); }
    if (ds.delm) { delete S.meas[S.who][ds.delm]; save(); return renderAnalisi(); }
    if (ds.alt) { S.alt = S.alt || {}; S.alt[ds.alt] = (altIdx(ds.alt) + 1) % VAR[ds.alt].length; save(); var ok3 = openKeys[sel + S.who] = openKeys[sel + S.who] || {}; ok3[ds.alt.split(':')[1]] = true; return renderOggi(); }
    if (ds.supp) { var sk = iso(dateOf(sel)); S.supp[sk] = S.supp[sk] || {}; S.supp[sk][ds.supp] = !S.supp[sk][ds.supp]; save(); return renderOggi(); }
    if (ds.shop) { S.shop[ds.shop] = !S.shop[ds.shop]; save(); return renderSpesa(); }
    if (t.id === 'shopHide') { shopHide = !shopHide; return renderSpesa(); }
    if (t.id === 'shopReset') { if (confirm('Svuotare le spunte della spesa?')) { S.shop = {}; save(); renderSpesa(); } return; }
    if (ds.rf) { rf = ds.rf; return renderRicette(); }
    if (t.id === 'rwe') { rwe = !rwe; return renderRicette(); }
    if (ds.rec) return openSheet(recipeHTML(ds.rec));
    if (ds.ideas) return openSheet(ideasHTML(ds.ideas));
    if (t.id === 'calStart') { S.calStart = iso(monday()); save(); return renderCal(); }
    if (t.id === 'calToday') { S.calStart = iso(NOW); save(); return renderCal(); }
    if (t.id === 'calStop') { delete S.calStart; save(); return renderCal(); }
  });
  $('#scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'wform') return; e.preventDefault();
    var v = parseFloat(String($('#wkg').value).replace(',', '.')); if (!(v > 40 && v < 250)) { $('#wkg').focus(); return; }
    S.w = S.w || {}; S.w[iso(NOW)] = v; save(); PLAN = null; renderAnalisi(); toast('Peso salvato');
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'mform') return; e.preventDefault();
    var rec = {}; CIRC.concat(PLICHE).forEach(function (c) { var el = document.getElementById('m-' + c[0]), v = el ? parseVals(el.value) : null; if (v) rec[c[0]] = v; });
    if (!Object.keys(rec).length) { var f = document.getElementById('m-vita'); if (f) f.focus(); return; }
    var d = $('#mdate').value || iso(NOW); S.meas = S.meas || {}; S.meas[S.who] = S.meas[S.who] || {};
    S.meas[S.who][d] = Object.assign(S.meas[S.who][d] || {}, rec); save(); closeSheet(); renderAnalisi(); toast('Misure salvate');
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'rq') { rq = e.target.value; renderRicette(true); }
    if (e.target.id === 'lq' && LG) { LG.q = e.target.value; $('#lres').innerHTML = resHTML(); }
    if (e.target.id === 'lgr' && LG && LG.pick) $('#lpk').innerHTML = pickKcal();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'lgr') { e.preventDefault(); var b = document.querySelector('[data-ladd]'); if (b) b.click(); } });
  window.addEventListener('scroll', function () { $('#top').classList.toggle('sc', window.scrollY > 4); }, { passive: true });
  /* swipe tra i giorni */
  var sx = null, sy = null;
  $('#main').addEventListener('touchstart', function (e) { if (tab !== 'oggi') return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('#main').addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { sel = (sel + (dx < 0 ? 1 : 6)) % 7; render(); }
  }, { passive: true });
  window.ARME_DIET = {
    go: function (t) { if (t !== 'oggi') sel = TODAYI; tab = t; LG = null; closeSheet(); window.scrollTo(0, 0); render(); },
    paint: function () { paintMe(); }
  };
  render();
})();
